name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same ref cancels a superseded one. Runs on main and tags each get their own
# group, so none of them is cancelled or displaced while queued.
concurrency:
  group: test-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # A push or pull request that changes only docs/ runs lint alone, and verify reports as
  # skipped. Tags, new branches, forced pushes, manual runs and anything it cannot classify run
  # every job.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # A forced push, a new branch or tag (an all-zero before) or a base this clone does not
          # have leaves base empty, which runs everything.
          base=
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
          elif [ "$EVENT" = push ] && [ "$FORCED" != true ]; then
            base=$BEFORE
          fi
          code=true
          if [ -n "$base" ] && [ -n "${base//0/}" ] \
            && git merge-base --is-ancestor "$base" HEAD 2>/dev/null \
            && paths=$(git diff --name-only --no-renames "$base" HEAD) \
            && [ -n "$paths" ] && ! grep -qv '^docs/' <<<"$paths"; then
            code=false
          fi
          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "changed paths outside docs/: $code"
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
  verify:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Verification is capped at fifteen minutes: a job still running then
    # has hung rather than completed its bounded source and package checks.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Build and prove the release artifact
        run: SOURCE_COMMIT="$GITHUB_SHA" SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: game-kit-${{ github.sha }}
          path: |
            .claude/release-output/game-kit-*.tgz
            .claude/release-output/SHA256SUMS
            .claude/release-output/SOURCE_COMMIT
          if-no-files-found: error
          include-hidden-files: true
