name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same ref cancels a superseded one. Runs on main and tags each get their own
# group, so none of them is cancelled or displaced while queued.
concurrency:
  group: test-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - id: npm-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/game-kit-npm-cache
          key: game-kit-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Load the cached npm cache into its Docker volume
        if: steps.npm-cache.outputs.cache-hit == 'true'
        run: node scripts/npm-cache.ts load "$RUNNER_TEMP/game-kit-npm-cache"
      # The gate packs the committed revision and checks that tarball; the same files are uploaded.
      - name: Verify source and the packed release in isolated containers
        run: node scripts/check.ts .claude/release-output
      - name: Copy the npm cache volume out for saving
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: node scripts/npm-cache.ts save "$RUNNER_TEMP/game-kit-npm-cache"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: game-kit-${{ github.sha }}
          path: |
            .claude/release-output/game-kit-*.tgz
            .claude/release-output/SHA256SUMS
            .claude/release-output/SOURCE_COMMIT
          if-no-files-found: error
          include-hidden-files: true
