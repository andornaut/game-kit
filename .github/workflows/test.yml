name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Verify source and packed native bootstrap in isolated containers
        run: node scripts/check.ts
      - name: Build committed release artifacts offline
        run: node scripts/pack.ts .claude/release-output
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: game-kit-${{ github.sha }}
          path: |
            .claude/release-output/game-kit-*.tgz
            .claude/release-output/SHA256SUMS
            .claude/release-output/SOURCE_COMMIT
          if-no-files-found: error
          include-hidden-files: true
